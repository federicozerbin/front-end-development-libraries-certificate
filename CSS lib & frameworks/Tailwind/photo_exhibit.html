<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-b from-emerald-50 to-green-100 min-h-screen px-4 pb-16">
    <div class="main-container grid grid-cols-3 grid-cols-1 md:grid-cols-3 max-w-6xl mx-auto gap-8 mt-16">
        <div
            class="card rounded-xl p-4 block bg-white border border-emerald-200 shadow-md shadow-emerald-900/10 hover:shadow-xl hover:shadow-emerald-900/20 hover:-translate-y-1 transition duration-300 ring-1 ring-emerald-100">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="Colosseum"
                class="rounded-lg w-full h-56 object-cover" />
            <p class="subheading text-center font-bold text-lg text-emerald-800 mt-4">Colosseum</p>
            <p class="description text-center font-base text-sm text-emerald-600 mt-1">Our Colosseum</p>
        </div>
        <div
            class="card rounded-xl p-4 block bg-white border border-emerald-200 shadow-md shadow-emerald-900/10 hover:shadow-xl hover:shadow-emerald-900/20 hover:-translate-y-1 transition duration-300 ring-1 ring-emerald-100">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="Alps"
                class="rounded-lg w-full h-56 object-cover" />
            <p class="subheading text-center font-bold text-lg text-emerald-800 mt-4">Alps</p>
            <p class="description text-center font-base text-sm text-emerald-600 mt-1">Our Alps</p>
        </div>
        <div
            class="card rounded-xl p-4 block bg-white border border-emerald-200 shadow-md shadow-emerald-900/10 hover:shadow-xl hover:shadow-emerald-900/20 hover:-translate-y-1 transition duration-300 ring-1 ring-emerald-100">
            <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="Sea"
                class="rounded-lg w-full h-56 object-cover" />
            <p class="subheading text-center font-bold text-lg text-emerald-800 mt-4">The sea</p>
            <p class="description text-center font-base text-sm text-emerald-600 mt-1">Our Sea</p>
        </div>
    </div>
</body>

</html>
